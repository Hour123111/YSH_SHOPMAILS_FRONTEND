<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom styles for green gradient background and modern UI */
      body {
        background: linear-gradient(135deg, #e6fffa 0%, #a3e4d7 100%);
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 2rem;
      }
      .container {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 2rem;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .container:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 128, 0, 0.15);
      }
      .content-card {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 0.75rem;
        padding: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: transform 0.3s ease;
      }
      .content-card:hover {
        transform: scale(1.02);
      }
      .btn-primary {
        background: linear-gradient(to right, #2f855a, #38a169);
        transition: background-color 0.3s ease, transform 0.2s ease;
      }
      .btn-primary:hover {
        background: linear-gradient(to right, #276749, #2f855a);
        transform: translateY(-2px);
      }
      input:focus {
        border-color: #2f855a;
        box-shadow: 0 0 0 3px rgba(47, 133, 90, 0.2);
      }
      .section-title {
        border-bottom: 2px solid #38a169;
        padding-bottom: 0.5rem;
        color: #1a4731;
        font-size: 1.25rem;
        font-weight: 600;
      }
      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }
        .container {
          padding: 1.5rem;
        }
        h1 {
          font-size: 1.5rem;
        }
        .grid-cols-2 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container max-w-4xl mx-auto">
      <h1 class="text-2xl font-bold text-center text-green-900 mb-6">
        {{.Title}}
      </h1>
      {{if .Error}}
      <div class="bg-red-50 text-red-600 p-4 rounded-lg mb-4">{{.Error}}</div>
      {{end}}
      <h2 class="text-xl font-semibold text-green-800 mb-4 section-title">
        Add Balance
      </h2>
      <form method="POST">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="content-card">
            <label class="block text-green-800">Email:</label>
            <input
              name="mail"
              type="email"
              class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
              placeholder="Enter email"
            />
          </div>
          <div class="content-card">
            <label class="block text-green-800">Balance:</label>
            <input
              name="balance"
              step="0.001"
              type="number"
              class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
              placeholder="Enter balance"
            />
          </div>
        </div>
        <button
          name="action"
          value="add_balance"
          class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
        >
          Add Balance
        </button>
        <button
                name="action"
                value="recheck_m3"
                class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
        >
          RecheckM3
        </button>
      </form>
      <form method="POST">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="content-card">
            <label class="block text-green-800">IDs:
            <textarea
                    name="mail"
                    class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
                    placeholder="Enter email"
            ></textarea>
            </label>
          </div>
        </div>
        <button
                name="action"
                value="reset_mail"
                class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
        >
          Reset Mail
        </button>
        <button
                name="action"
                value="add_mail"
                class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
        >
          Add Mail
        </button>
        <button
                name="action"
                value="add_mail_skip"
                class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
        >
          Add Mail Skip
        </button>
        <button
                name="action"
                value="add_mail_new"
                class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
        >
          Add Mail New
        </button>
      </form>
      <form method="POST">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="content-card">
            <label class="block text-green-800">Email:</label>
            <input
                    name="mail"
                    type="email"
                    class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
                    placeholder="Enter email"
            />
          </div>
          <div class="content-card">
            <label class="block text-green-800">Balance:</label>
            <input
                    name="balance"
                    step="0.001"
                    type="number"
                    class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
                    placeholder="Enter balance"
            />
          </div>
        </div>
        <button
                name="action"
                value="set_price"
                class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
        >
          Set Price
        </button>
      </form>
      <br>

      <h2 class="text-xl font-semibold text-green-800 mb-4 section-title">
        Confirm Bakong MD5
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div class="content-card">
          <label class="block text-green-800">MD5:</label>
          <input
            id="bakong-md5"
            type="text"
            class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
            placeholder="Enter MD5"
          />
        </div>
      </div>
      <button
        type="button"
        onclick="confirmBakongMd5()"
        class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
      >
        Submit
      </button>
      <p id="bakong-md5-result" class="mt-3 text-green-800"></p>
      <br>

      <form method="POST">
        {{ range $key, $value := .Config }}
        <label>
          {{ $key }}
          <input
                  name="{{ $key }}"
                  type="text"
                  class="w-min p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
                  value="{{ $value }}"
          />
        </label>
        <br>
        <br>
        {{ end }}
        <button
                name="action"
                value="save_config"
                class="btn-primary text-white py-2 px-4 rounded-lg hover:shadow-lg font-medium"
        >
          Save
        </button>
      </form>
      <p class="text-green-600 mt-6">Some additional information...</p>
    </div>
    <script>
      async function confirmBakongMd5() {
        const input = document.getElementById("bakong-md5");
        const resultEl = document.getElementById("bakong-md5-result");
        const md5 = (input.value || "").trim();
        if (!md5) {
          resultEl.textContent = "Please enter MD5";
          resultEl.className = "mt-3 text-red-600";
          return;
        }
        resultEl.textContent = "Loading...";
        resultEl.className = "mt-3 text-green-800";
        try {
          const res = await fetch(
            "https://yshshopmails.com/bakong/confirm_md5?pw=g8daywuaghiwuabdai767bausgdbwygydarasd423442asgh&md5=" +
              encodeURIComponent(md5)
          );
          const data = await res.json();
          if (data.status === "ok") {
            resultEl.textContent = "OK";
            resultEl.className = "mt-3 text-green-600";
          } else {
            resultEl.textContent = data.error || "Failed";
            resultEl.className = "mt-3 text-red-600";
          }
        } catch (e) {
          resultEl.textContent = e.message || "Request failed";
          resultEl.className = "mt-3 text-red-600";
        }
      }
    </script>
  </body>
</html>
