<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/config.js"></script>
    <link rel="icon" href="/static/img/yshshopmails-logo.png" type="image/png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
    <script defer src="/static/js/ui.js"></script>
  </head>
  <body class="app-body auth-page font-sans">
    <div class="auth-shell">
      <div class="surface auth-card rise-in">
        <div class="text-center mb-8">
          <div class="brand-mark mx-auto mb-4" style="width: 3.25rem; height: 3.25rem">
            <img src="/static/img/yshshopmails-logo.png" alt="YSHSHOPMAILS" />
          </div>
          <p class="text-xs font-semibold tracking-[0.18em] uppercase text-teal-700 dark:text-teal-300 mb-2">
            YSHSHOPMAILS
          </p>
          <h1 class="font-display text-2xl sm:text-3xl font-bold gradient-text">{{.Title}}</h1>
        </div>

        {{if .Error}}
        <div
          class="bg-red-50 dark:bg-red-500/15 border border-red-200 dark:border-red-500/30 text-red-700 dark:text-red-200 p-4 rounded-xl mb-6 text-sm"
        >
          <div class="flex items-start gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
            </svg>
            <div>{{.Error}}</div>
          </div>
        </div>
        {{end}} {{if .Message}}
        <div
          class="bg-emerald-50 dark:bg-emerald-500/15 border border-emerald-200 dark:border-emerald-500/30 text-emerald-700 dark:text-emerald-200 p-4 rounded-xl mb-6 text-sm"
        >
          <div class="flex items-start gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
            <div>{{.Message}}</div>
          </div>
        </div>
        {{end}}

        <nav class="flex flex-col gap-3">
          <a href="/login" class="btn-primary w-full text-center py-3 px-4 text-white">
            Login Again
          </a>
          <a
            href="/signup"
            class="w-full py-3 px-4 text-center rounded-[0.85rem] font-semibold border border-slate-200 dark:border-white/15 bg-white/60 dark:bg-white/5 text-slate-700 dark:text-slate-200 hover:bg-teal-50 dark:hover:bg-white/10 transition-colors"
          >
            Register New Account
          </a>
        </nav>

        <div class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
          Need help?
          <a href="https://t.me/yshshopmails" class="font-medium text-teal-700 dark:text-teal-300 hover:underline">
            Contact support
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
