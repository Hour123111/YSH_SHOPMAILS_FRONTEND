{{define "auth-header"}}
<header class="app-header">
  <div class="max-w-6xl mx-auto section-pad py-3 app-header-inner">
    <a href="/" class="flex items-center gap-2.5 min-w-0">
      <div class="brand-mark">
        <img src="/static/img/yshshopmails-logo.png" alt="YSHSHOPMAILS" />
      </div>
      <div class="min-w-0">
        <div class="font-display font-bold text-[0.95rem] sm:text-base leading-tight truncate">
          YSHSHOPMAILS
        </div>
        <div class="text-[0.72rem] sm:text-xs text-[var(--muted)]">
          OTP mail &amp; verification tools
        </div>
      </div>
    </a>

    <div class="header-actions">
      {{if eq .AuthNav "signup"}}
      <a href="/signup" class="nav-signup-btn">Sign up</a>
      {{else if eq .AuthNav "login"}}
      <a href="/login" class="nav-login-btn">
        <span class="nav-icon-wrap login hidden sm:grid" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="3.2" />
            <path d="M6 20c1.2-3 3.4-4.5 6-4.5s4.8 1.5 6 4.5" />
          </svg>
        </span>
        Login
      </a>
      {{end}}
      <button type="button" onclick="toggleTheme()" class="theme-toggle" aria-label="Toggle light and dark mode">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 13.5A8.5 8.5 0 0 1 10.5 3 7 7 0 0 0 21 13.5z" />
        </svg>
      </button>
    </div>
  </div>
</header>
{{end}}
